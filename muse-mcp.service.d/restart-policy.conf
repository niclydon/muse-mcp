# Restart backoff policy. Install as
# /etc/systemd/system/muse-mcp.service.d/restart-policy.conf.
#
# A finite start-limit window turns any outage longer than
# burst x delay into a permanent `failed` state (start-limit-hit),
# which Restart=always never leaves. Disable the limit and back
# off instead: the first retry after 5s, the delay growing to
# 5 minutes over 6 steps, then every 300s until the dependency
# returns. RestartSteps / RestartMaxDelaySec need systemd 254+.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
RestartSteps=6
RestartMaxDelaySec=300
